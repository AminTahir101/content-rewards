<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- TV body -->
  <rect x="6" y="20" width="108" height="76" rx="14" fill="#22c55e"/>
  <!-- Body shadow top highlight -->
  <rect x="6" y="20" width="108" height="38" rx="14" fill="white" opacity="0.10"/>
  <!-- Screen bezel -->
  <rect x="18" y="30" width="74" height="54" rx="9" fill="#111827"/>
  <!-- Screen inner glow -->
  <rect x="18" y="30" width="74" height="54" rx="9" fill="white" opacity="0.04"/>
  <!-- Scissors handle top circle -->
  <circle cx="38" cy="44" r="8" stroke="#4ade80" stroke-width="3.5" fill="none"/>
  <circle cx="38" cy="44" r="2.5" fill="#4ade80"/>
  <!-- Scissors handle bottom circle -->
  <circle cx="38" cy="70" r="8" stroke="#4ade80" stroke-width="3.5" fill="none"/>
  <circle cx="38" cy="70" r="2.5" fill="#4ade80"/>
  <!-- Blade top -->
  <line x1="44.5" y1="49" x2="82" y2="62" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Blade bottom -->
  <line x1="44.5" y1="65" x2="82" y2="52" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Knob -->
  <circle cx="106" cy="40" r="7" fill="#16a34a"/>
  <circle cx="106" cy="40" r="3.5" fill="#0d6b27"/>
  <!-- Feet -->
  <rect x="34" y="94" width="14" height="9" rx="4.5" fill="#16a34a"/>
  <rect x="72" y="94" width="14" height="9" rx="4.5" fill="#16a34a"/>
</svg>
